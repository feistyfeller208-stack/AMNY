[package]
name = "amny"
version = "0.1.0"
edition = "2021"

[lib]
name = "amny"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "node"
path = "src/bin/node.rs"

[dependencies]
sodiumoxide = "0.2"
sha2 = "0.10"
aes-gcm = "0.10"
sharks = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
rand = "0.8"
rpassword = "7.3"
fs4 = "0.9"

[profile.dev]
opt-level = 3